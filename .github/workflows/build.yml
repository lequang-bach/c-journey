name: build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile every .c with strict warnings
        run: |
          status=0
          for f in $(find days king-exercises -name '*.c'); do
            echo "== $f"
            gcc -std=c99 -Wall -Wextra -Werror -c "$f" -o /dev/null || status=1
          done
          exit $status
